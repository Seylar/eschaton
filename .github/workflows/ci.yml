name: ci

on:
  push:
    # `bureau` publie la vague SP2 afin que la VM la teste avant revue/fusion.
    # À refermer sur main après la revue Claude.
    branches: [main, bureau]
  pull_request:

# La sérialisation doit couvrir les BUILDS, pas seulement le déploiement Pages.
# Sinon deux pushes rapprochés peuvent chacun reconstruire un nouveau pkgrel
# avant que le premier soit public, puis publier deux archives différentes sous
# le même nom. Les PR attendent aussi leur tour : ce dépôt privilégie
# l'immutabilité de ses paquets à quelques minutes de latence CI.
concurrency:
  group: eschaton-repository-ci
  cancel-in-progress: false

# Permissions minimales par défaut ; seul le job de publication est élevé.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # curl et jq sont préinstallés sur ubuntu-latest ; on les demande quand même
      # pour que la dépendance de `tools/check-desktop-deps` soit lisible ici.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats curl jq
      - name: shellcheck
        run: |
          shellcheck \
            tools/sandbox tools/build-pkg tools/provision-gradle \
            tools/check-desktop-deps \
            repo/build-repo \
            installer/lib.sh installer/eschaton-install \
            packages/eschaton-base/lib.sh \
            packages/eschaton-base/eschaton-update \
            packages/eschaton-base/eschaton-rollback \
            packages/eschaton-desktop-config/eschaton-session \
            packages/eschaton-desktop-config/eschaton-dms-provision
      # `tools/vm-serial` n'a pas d'extension .py et échappe à tout linter de
      # paquet : au minimum, il doit compiler.
      - name: py_compile
        run: python3 -m py_compile tools/vm-serial
      - name: bats
        run: bats tests/
      # En dernier : seule étape du job qui sorte sur le réseau. `eschaton-desktop`
      # est un meta `arch=(any)` — les deux jobs de build le construisent à
      # l'identique et ne prouvent RIEN sur la disponibilité de ce qu'il déclare.
      # Une dépendance présente côté Arch x86_64 mais absente d'ALARM aarch64
      # passerait toute la CI pour n'échouer qu'à l'installation sur la machine
      # ARM ; cette garde la rattrape ici.
      - name: dépendances du bureau (Arch x86_64 + ALARM aarch64)
        run: tools/check-desktop-deps

  # Un job de build PAR ARCHITECTURE (spec §5.3) : les deux paquets vendorés
  # sont des binaires natifs compilés par GraalVM, pas des paquets `any`. Chaque
  # job construit dans un conteneur Arch natif de sa cible et publie son propre
  # répertoire de dépôt.
  build-x86_64:
    needs: lint
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      # Avant le checkout : sans git dans le conteneur, actions/checkout se
      # rabat sur un téléchargement d'archive REST. `-Syu` et non `-Sy` pour ne
      # pas fabriquer une mise à jour partielle ; --disable-sandbox parce que le
      # bac à sable Landlock de pacman 7 est refusé par le profil seccomp par
      # défaut de Docker (cf. repo/build-repo).
      - name: git dans le conteneur
        run: pacman -Syu --noconfirm --needed --disable-sandbox git
      - uses: actions/checkout@v7
      - name: build-repo
        env:
          # Ne jamais republier des octets différents sous le même pkgrel : les
          # caches Pacman existants deviendraient invalides. Le build réutilise
          # les archives dont le nom est déjà présent dans le dépôt public.
          ESCHATON_REPO_SEED_URL: https://seylar.github.io/eschaton/x86_64
        run: repo/build-repo
      - uses: actions/upload-artifact@v7
        with:
          name: repo-x86_64
          path: repo/out/x86_64
          if-no-files-found: error

  build-aarch64:
    needs: lint
    runs-on: ubuntu-24.04-arm
    container: menci/archlinuxarm:base-devel
    timeout-minutes: 60
    steps:
      - name: git dans le conteneur
        run: pacman -Syu --noconfirm --needed --disable-sandbox git
      - uses: actions/checkout@v7
      - name: build-repo
        env:
          ESCHATON_REPO_SEED_URL: https://seylar.github.io/eschaton/aarch64
        run: repo/build-repo
      - uses: actions/upload-artifact@v7
        with:
          name: repo-aarch64
          path: repo/out/aarch64
          if-no-files-found: error

  # Assemblage de la racine du site Pages (aarch64/ + x86_64/) puis déploiement.
  # Le client n'écrit qu'une ligne — `Server = .../eschaton/$arch` — et pacman
  # choisit le répertoire.
  publish:
    needs: [build-x86_64, build-aarch64]
    # Publication de validation SP2 depuis `bureau`, sans fusionner dans main.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/bureau'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Un seul déploiement Pages à la fois.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: repo-x86_64
          path: site/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: repo-aarch64
          path: site/aarch64
      - name: Contenu publié
        run: find site -type f | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
