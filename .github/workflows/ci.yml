name: ci

on:
  push:
    branches: [main]
  pull_request:

# La sérialisation doit couvrir les BUILDS, pas seulement le déploiement Pages.
# Sinon deux pushes rapprochés peuvent chacun reconstruire un nouveau pkgrel
# avant que le premier soit public, puis publier deux archives différentes sous
# le même nom. Les PR attendent aussi leur tour : ce dépôt privilégie
# l'immutabilité de ses paquets à quelques minutes de latence CI.
concurrency:
  group: eschaton-repository-ci
  cancel-in-progress: false

# Permissions minimales par défaut ; seul le job de publication est élevé.
permissions:
  contents: read

# TOUT CE QUI S'EXÉCUTE ICI EST ÉPINGLÉ PAR EMPREINTE (plan SP4b-1 Task 3.4) :
# les actions par SHA de commit, les IMAGES DE CONTENEUR par digest.
# Une étiquette (`@v7`, `:base-devel`) est une référence MOUVANTE : son
# mainteneur peut la déplacer sur n'importe quel commit ou n'importe quelle
# image, et ce qui tourne ici avec accès au `GITHUB_TOKEN` change alors sans
# qu'aucun fichier de ce dépôt ne bouge. L'argument ne vaut pas moins pour une
# image que pour une action : les jobs de build tournent EN ROOT dedans.
# La veille §4.4 range cette dette au rang de prérequis de sécurité dès que la
# clé de signature approche la CI (SP4a). Le commentaire `# vN` garde la version
# lisible ; c'est l'empreinte qui fait foi.
# SHA relevés le 2026-08-29 via l'API GitHub (`/repos/<dépôt>/git/ref/tags/<tag>`).
# Digests relevés le 2026-08-30 via l'API du registre Docker Hub
# (`/v2/<dépôt>/manifests/<étiquette>`, en-tête `Docker-Content-Digest`).
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `persist-credentials: false` partout : aucun job de ce dépôt ne pousse
      # ni ne parle à git après le checkout. Laisser le `GITHUB_TOKEN` inscrit
      # dans .git/config ne servirait qu'à l'exposer aux outils qu'on lance.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # curl et jq sont préinstallés sur ubuntu-latest ; on les demande quand même
      # pour que la dépendance de `tools/check-desktop-deps` soit lisible ici.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats curl jq
      - name: shellcheck
        run: |
          shellcheck \
            tools/sandbox tools/build-pkg tools/provision-gradle \
            tools/check-desktop-deps \
            repo/build-repo \
            iso/build-iso iso/eschaton/profiledef.sh \
            installer/lib.sh installer/eschaton-install \
            packages/eschaton-base/lib.sh \
            packages/eschaton-base/eschaton-update \
            packages/eschaton-base/eschaton-rollback \
            packages/eschaton-desktop-config/eschaton-session \
            packages/eschaton-desktop-config/eschaton-dms-provision
      # Différé du Socle soldé au SP4 : un fichier sudoers invalide n'est pas
      # ignoré, il rend TOUT sudo inopérant sur la machine — y compris celui qui
      # servirait à le réparer. `visudo -cf` est la seule vérification qui
      # exerce le vrai analyseur ; `sudo` est préinstallé sur ubuntu-latest.
      - name: visudo
        run: visudo -cf packages/eschaton-base/10-wheel.sudoers
      # `tools/vm-serial` n'a pas d'extension .py et échappe à tout linter de
      # paquet : au minimum, il doit compiler.
      - name: py_compile
        run: python3 -m py_compile tools/vm-serial
      # `tests/iso-profil.bats` verrouille les invariants du profil archiso sans
      # rien construire : la construction de l'ISO vit dans son propre workflow
      # (.github/workflows/iso.yml), qui dure trop longtemps pour une PR.
      - name: bats
        run: bats tests/
      # En dernier : seule étape du job qui sorte sur le réseau. `eschaton-desktop`
      # est un meta `arch=(any)` — les deux jobs de build le construisent à
      # l'identique et ne prouvent RIEN sur la disponibilité de ce qu'il déclare.
      # Une dépendance présente côté Arch x86_64 mais absente d'ALARM aarch64
      # passerait toute la CI pour n'échouer qu'à l'installation sur la machine
      # ARM ; cette garde la rattrape ici.
      - name: dépendances du bureau (Arch x86_64 + ALARM aarch64)
        run: tools/check-desktop-deps

  # Un job de build PAR ARCHITECTURE (spec §5.3) : les deux paquets vendorés
  # sont des binaires natifs compilés par GraalVM, pas des paquets `any`. Chaque
  # job construit dans un conteneur Arch natif de sa cible et publie son propre
  # répertoire de dépôt.
  build-x86_64:
    needs: lint
    runs-on: ubuntu-latest
    # Index OCI multi-plateforme (linux/amd64) de `archlinux:base-devel`.
    container: archlinux@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d # base-devel
    timeout-minutes: 60
    steps:
      # Avant le checkout : sans git dans le conteneur, actions/checkout se
      # rabat sur un téléchargement d'archive REST. `-Syu` et non `-Sy` pour ne
      # pas fabriquer une mise à jour partielle ; --disable-sandbox parce que le
      # bac à sable Landlock de pacman 7 est refusé par le profil seccomp par
      # défaut de Docker (cf. repo/build-repo).
      - name: git dans le conteneur
        run: pacman -Syu --noconfirm --needed --disable-sandbox git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: build-repo
        env:
          # Ne jamais republier des octets différents sous le même pkgrel : les
          # caches Pacman existants deviendraient invalides. Le build réutilise
          # les archives dont le nom est déjà présent dans le dépôt public.
          ESCHATON_REPO_SEED_URL: https://seylar.github.io/eschaton/x86_64
        run: repo/build-repo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repo-x86_64
          path: repo/out/x86_64
          if-no-files-found: error

  build-aarch64:
    needs: lint
    runs-on: ubuntu-24.04-arm
    # Index OCI multi-plateforme (linux/arm64 entre autres) de
    # `menci/archlinuxarm:base-devel` — image d'un TIERS, donc celle dont
    # l'épinglage compte le plus.
    container: menci/archlinuxarm@sha256:523f076753371360e54f72f23668ff21f0658da41464a1f63fe1fd9d73ae9166 # base-devel
    timeout-minutes: 60
    steps:
      - name: git dans le conteneur
        run: pacman -Syu --noconfirm --needed --disable-sandbox git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: build-repo
        env:
          ESCHATON_REPO_SEED_URL: https://seylar.github.io/eschaton/aarch64
        run: repo/build-repo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repo-aarch64
          path: repo/out/aarch64
          if-no-files-found: error

  # Assemblage de la racine du site Pages (aarch64/ + x86_64/) puis déploiement.
  # Le client n'écrit qu'une ligne — `Server = .../eschaton/$arch` — et pacman
  # choisit le répertoire.
  publish:
    needs: [build-x86_64, build-aarch64]
    # Publication depuis `main` uniquement (bascule post-fusion SP2).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Un seul déploiement Pages à la fois.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: repo-x86_64
          path: site/x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: repo-aarch64
          path: site/aarch64
      - name: Contenu publié
        run: find site -type f | sort
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
