#
# pacman.conf utilisé par mkarchiso POUR CONSTRUIRE l'environnement live.
# Ce n'est pas celui de l'environnement live lui-même : voir
# airootfs/etc/pacman.conf. Les deux doivent rester d'accord sur le bloc
# [eschaton] — c'est ce couple qui matérialise « le dépôt préconfiguré »
# de la spec §3.3.
#
# Dérivé de configs/releng/pacman.conf d'archiso 89-1 (voir ../PROVENANCE.md),
# réduit aux options que nous utilisons réellement.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5

# `Required DatabaseOptional` est le réglage global d'Arch : les paquets des
# dépôts officiels doivent être signés, la base de données non.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# --- dépôt Eschaton -----------------------------------------------------------
# `$arch` est LITTÉRAL : c'est pacman qui le substitue. Le dépôt est publié par
# architecture (spec §5.3 du Socle).
#
# ⚠️ PLACE RÉSERVÉE AU SP4a — cette ligne SigLevel est l'unique chose à changer
# ici quand le trousseau existera :
#     SigLevel = Optional TrustAll   →   SigLevel = Required DatabaseOptional
# La même ligne existe dans airootfs/etc/pacman.conf ; les deux changent
# ensemble. Voir ../README.md § « La place du trousseau ».
[eschaton]
SigLevel = Optional TrustAll
Server = https://seylar.github.io/eschaton/$arch
