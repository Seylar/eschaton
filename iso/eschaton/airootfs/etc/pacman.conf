#
# pacman.conf de l'ENVIRONNEMENT LIVE d'Eschaton.
#
# Il remplace celui du paquet `pacman` : ce fichier est dans le `backup=` de
# `pacman`, donc pacstrap dépose sa version en `.pacnew` (que mkarchiso efface
# ensuite) et laisse la nôtre en place. Même mécanique que le /etc/passwd de
# `releng`.
#
# Ce qu'il apporte par rapport à l'amont : le dépôt [eschaton] déjà déclaré.
# `eschaton-install` sait l'ajouter lui-même s'il manque (son test
# `grep -q "^\[eschaton\]"` le rend idempotent) — mais l'avoir ici permet de
# faire un `pacman -S eschaton-base` dans le live sans lancer l'installeur, ce
# qui est ce que la spec §3.3 appelle « le dépôt préconfiguré ».
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
CheckSpace

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# --- dépôt Eschaton -----------------------------------------------------------
# ⚠️ PLACE RÉSERVÉE AU SP4a : voir la note jumelle dans ../../pacman.conf.
# `Include` et non `Server =` en dur : `eschaton-install` réécrit
# /etc/pacman.d/eschaton-mirror, et le fichier livré ici a déjà le bon contenu —
# l'installeur devient donc idempotent des deux côtés.
[eschaton]
SigLevel = Optional TrustAll
Include = /etc/pacman.d/eschaton-mirror
