# Crochets de l'initramfs de l'environnement live.
#
# Écart avec `releng` : les quatre crochets PXE (archiso_pxe_common,
# archiso_pxe_nbd, archiso_pxe_http, archiso_pxe_nfs) sont retirés, en même
# temps que le paquet `mkinitcpio-nfs-utils` dont ils dépendent. Eschaton ne
# démarre pas par le réseau ; laisser les crochets sans le paquet ferait
# échouer la génération de l'initramfs.
#
# Le crochet `memdisk` est retiré LUI AUSSI, et c'est un constat de terrain, pas
# une préférence : il appelle `memdiskfind`, un binaire du paquet `syslinux` —
# que nous avons retiré avec le chemin BIOS. Sans lui, mkinitcpio rend
# « ERROR: binary not found: 'memdiskfind' » puis « errors were encountered
# during the build », et pourtant la construction de l'ISO CONTINUE : pacman
# traite l'échec d'un crochet post-transaction comme un avertissement, mkarchiso
# ne le voit pas, et l'image sort avec un initramfs incomplet. Constaté le
# 2026-08-29 sur la première construction. `iso/build-iso` relit désormais la
# sortie pour attraper ce cas.
# (MEMDISK est de toute façon une mécanique d'amorçage syslinux/BIOS : sans BIOS,
# le crochet n'a aucun usage.)
#
# `archiso_loop_mnt` est conservé : il permet de démarrer l'ISO depuis un
# FICHIER posé sur une partition (clé USB multi-images), ce qui ne coûte rien.
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)

# zstd et non `xz -9e` : même arbitrage que le squashfs (voir profiledef.sh).
# L'initramfs est décompressé à chaque démarrage, sur une machine dont on ne
# connaît pas la puissance.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
