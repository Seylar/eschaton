# Eschaton est une distribution francophone et `eschaton-install` écrit
# KEYMAP=fr sur le système cible : l'environnement live prend la même
# disposition, sans quoi le mot de passe saisi à l'installation ne
# correspondrait pas à celui du système installé.
# Pour un clavier QWERTY : `loadkeys us` (rappelé dans /etc/motd).
KEYMAP=fr
FONT=ter-116n
