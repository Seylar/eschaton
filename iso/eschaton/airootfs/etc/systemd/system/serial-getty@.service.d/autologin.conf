# Auto-connexion root sur la console SÉRIE, en plus de tty1.
#
# `releng` ne le fait pas : sur l'ISO Arch officielle, la série n'existe même
# pas sans repatcher l'image à l'octet (tools/vm-dev.md §10.3 — c'est le poste
# le plus coûteux du smoke test x86_64). Le média Eschaton étant le nôtre, la
# ligne `console=ttyS0,115200` est dans l'entrée d'amorçage et l'auto-connexion
# ici : la VM est pilotable dès le premier démarrage, sans manipulation.
#
# Portée de sécurité : nulle par rapport à l'existant. root a déjà un mot de
# passe VIDE et une auto-connexion sur tty1 ; qui atteint le port série d'une
# machine atteint son clavier. À revoir le jour où ce média devient un produit
# grand public (et où root aura un mot de passe) : voir ../../../../../../README.md
# § « Ce qui est un choix de média de développement ». (Six niveaux, pas cinq :
# serial-getty@.service.d → system → systemd → etc → airootfs → eschaton → iso.)
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear --autologin root --keep-baud 115200,57600,38400,9600 - ${TERM}
