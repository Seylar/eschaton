# Repris de `configs/releng` d'archiso (GPL-3.0-or-later, ../../../../../PROVENANCE.md).
#
# `yes`, et non `kernel`, qui figurait ici sans motif consigné. Les deux ne font
# pas la même chose : `kernel` LAISSE EN PLACE le réglage du noyau (désactivé
# par défaut), ce qui rendait ce fichier inopérant — un fichier dont le nom
# promet des extensions de vie privée et qui n'en active aucune. `yes` les
# active et préfère l'adresse temporaire à l'adresse publique, comme `releng`.
#
# Aucune trace du passage à `kernel` dans le dépôt : ni commentaire, ni entrée
# de PROVENANCE, ni ligne de spec. On revient donc à la valeur amont, qui est
# celle que le nom du fichier annonce. Si la divergence était voulue, c'est ici
# qu'il faut écrire pourquoi.
[Network]
IPv6PrivacyExtensions=yes
