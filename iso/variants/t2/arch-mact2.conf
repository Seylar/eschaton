# Dépôt tiers `arch-mact2` — POUR LA CONSTRUCTION DU VARIANT T2, ET RIEN D'AUTRE.
#
# `iso/build-iso --variant t2` ajoute ce fragment au pacman.conf de CONSTRUCTION
# (la copie de travail que mkarchiso consomme). Il n'entre JAMAIS dans
# ../../eschaton/airootfs/etc/pacman.conf, donc jamais dans l'environnement live,
# donc jamais dans le système installé. Le script vérifie ce point lui-même
# avant de rendre l'image, et les tests le verrouillent.
#
# POURQUOI CE CLOISONNEMENT (ADR 0004 §4.2)
# Ce dépôt est servi par un mirror tiers, publié par un mainteneur unique, et
# n'est PAS signé. Le SP4a doit fermer l'exigence de signature sur [eschaton] :
# laisser fuiter un dépôt `SigLevel = Never` dans la configuration par défaut
# viderait cette exigence de son sens — pacman accepterait alors n'importe quel
# paquet servi depuis ce miroir, sur n'importe quelle machine Eschaton.
#
# Sur la machine T2 elle-même, le dépôt sera ajouté SÉPARÉMENT et à la main, par
# l'auteur, avec sa politique propre — c'est le compromis affiché de l'ADR, pas
# un réglage par défaut.
#
# Source de l'adresse : wiki.t2linux.org/distributions/arch/installation/,
# relevée par la veille §2.1 et vérifiée le 2026-08-30 (37 paquets dans l'index,
# `linux-t2` en 7.1.8.arch1-3).

[arch-mact2]
SigLevel = Never
Server = https://mirror.funami.tech/arch-mact2/os/x86_64
