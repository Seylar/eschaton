[Unit]
# dms.service est lui-même ordonné APRÈS graphical-session.target. Mettre le
# provisioning dans les Wants de cette cible et l'ordonner après DMS crée le
# cycle target → provision → dms → target. Le tirer depuis DMS donne la chaîne
# acyclique voulue : graphical-session.target → dms.service → provisioning.
Wants=eschaton-dms-provision.service
Before=eschaton-dms-provision.service
