# Drop-in d'Eschaton pour greetd.service.
# ExecStart= vide d'abord la valeur du paquet greetd : sans cette ligne, systemd
# refuse la deuxième (« More than one ExecStart= setting is allowed only for
# Type=oneshot »).
[Service]
ExecStart=
ExecStart=/usr/bin/greetd --config /etc/eschaton/greetd.toml
