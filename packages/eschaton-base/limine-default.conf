### Configuration Limine d'Eschaton — installée en /etc/default/limine.
###
### Ce chemin est celui que les upstreams recommandent, et il n'appartient à
### aucun paquet : /etc/limine-snapper-sync.conf (paquet limine-snapper-sync) et
### /etc/limine-entry-tool.conf (paquet limine-mkinitcpio-hook) sont tous deux
### marqués backup= par leurs paquets — les livrer nous-mêmes provoquerait un
### conflit de fichiers pacman. /etc/default/limine est lu par les deux outils et
### a la priorité sur l'un comme sur l'autre.
###
### INVARIANT (spec §4.2 étape 6) — sans TARGET_OS_NAME, les deux outils
### retrouvent l'entrée de démarrage en se rabattant sur PRETTY_NAME puis NAME de
### /etc/os-release. La valeur ci-dessous DOIT rester identique au nom de
### l'entrée écrite dans limine.conf par eschaton-install (« /Eschaton »).
### Une divergence — un PRETTY_NAME embelli, un nom d'entrée retouché — fait
### cesser SILENCIEUSEMENT la génération des entrées de snapshot, c'est-à-dire le
### filet de sécurité tout entier (spec §6). Ne changer qu'en changeant les deux.
TARGET_OS_NAME="Eschaton"
