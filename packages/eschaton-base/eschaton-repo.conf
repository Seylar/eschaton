# Dépôt [eschaton] publié par la CI sur GitHub Pages (spec §5.3).
# $arch est littéral : c'est pacman qui le substitue (aarch64 / x86_64). Le
# dépôt est publié par architecture — les paquets vendorés sont des binaires
# natifs, pas des paquets `any`.
[eschaton]
SigLevel = Optional TrustAll
Server = https://seylar.github.io/eschaton/$arch
